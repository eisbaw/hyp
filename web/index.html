<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>hyp — a place to change your mind</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <aside>
        <a class="brand" href="#overview"
          ><span class="brand-mark">h<span>?</span></span
          ><strong>hyp<span class="version"> / 0.1</span></strong></a
        >
        <p class="eyebrow">RESEARCH NOTEBOOK</p>
        <nav aria-label="Main navigation">
          <a href="#overview" data-view="overview"
            ><span>◉</span> Hypotheses <b id="hyp-count">0</b></a
          >
          <a href="#experiments" data-view="experiments"
            ><span>⌁</span> Experiments</a
          >
          <a href="#evidence" data-view="evidence"><span>▤</span> Evidence</a>
          <a href="#matrix" data-view="matrix"
            ><span>▦</span> Evidence matrix</a
          >
          <a href="#graph" data-view="graph"><span>◇</span> Relationships</a>
          <a href="#all" data-view="all"><span>≡</span> All records</a>
        </nav>
        <div class="sidebar-bottom">
          <span class="local-dot"></span> LOCAL · FILES ARE YOURS
          <p>A place to change your mind.</p>
          <a id="export" href="/report.html" download="hyp-report.html"
            >Export notebook ↗</a
          >
        </div>
      </aside>
      <div class="workspace">
        <header>
          <div class="breadcrumb">
            Notebook <span>/</span> <strong id="crumb">Hypotheses</strong>
          </div>
          <div class="header-right">
            <span id="connection" role="status">Connecting…</span
            ><button id="new" class="primary">＋ New hypothesis</button>
          </div>
        </header>
        <div id="notice" role="alert" hidden></div>
        <main id="content" tabindex="-1"></main>
      </div>
    </div>
    <dialog id="editor">
      <form id="editor-form">
        <div class="dialog-head">
          <div>
            <span class="eyebrow">NOTEBOOK RECORD</span>
            <h2 id="editor-title">New hypothesis</h2>
          </div>
          <button
            type="button"
            id="close-editor"
            class="icon"
            aria-label="Close editor"
          >
            ×
          </button>
        </div>
        <div id="editor-fields"></div>
        <div id="form-error" role="alert"></div>
        <footer>
          <span id="form-hint">Saved as Markdown in your project.</span
          ><button type="button" id="cancel-editor">Cancel</button
          ><button type="submit" class="primary">Save record</button>
        </footer>
      </form>
    </dialog>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
