<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 750" width="1280" height="750" role="img" aria-labelledby="t d">
  <title id="t">How hyp's records connect</title>
  <desc id="d">A hypothesis H owns its falsification criteria F and predictions P. Evidence E is linked to H, F or P by a link that supports, contradicts or qualifies. Hypotheses are linked to each other by depends-on, competes-with or supersedes. An experiment X targets frozen copies of H, F and P; a run R of it freezes the plan and cites evidence. An assessment A judges H, cites linked evidence, names a criterion when falsified, and records a fingerprint of the basis; a change to the basis marks it needs review. A gap G is an open question, resolved by evidence. A data record D holds captured bytes and may be referenced by any other record.</desc>
  <!-- Drawn from src/model.rs: the Data enum, Relation, link validation, Snapshot::basis and derive (needs_review). Update it when those change. -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e6edf3; }
    .title { font-size: 22px; font-weight: 700; }
    .box { fill: #16243a; stroke-width: 2; }
    .basis { stroke: #39c5bb; }
    .outside { stroke: #5c6f88; }
    .head { font-size: 17px; font-weight: 700; }
    .letter { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; fill: #9ecbff; }
    .note { font-size: 13.5px; fill: #a9b8c9; }
    .edge { stroke: #8b9bb0; stroke-width: 2; fill: none; }
    .elabel { font-size: 13px; fill: #c9d4e0; }
    .rel { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #9ecbff; }
    .legend { font-size: 15px; fill: #a9b8c9; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b9bb0"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1278" height="748" rx="20" fill="#0f1a2b" stroke="#2b3b55" stroke-width="2"/>
  <text class="title" x="40" y="46">How the records connect</text>

  <!-- The claim: H with its criteria and predictions -->
  <rect x="470" y="70" width="380" height="230" rx="16" fill="#122036" stroke="#4a6a94" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="note" x="486" y="91">the claim</text>

  <rect class="box basis" x="540" y="100" width="240" height="74" rx="12"/>
  <text class="head" x="560" y="130"><tspan class="letter">H</tspan>  Hypothesis</text>
  <text class="note" x="560" y="155">claim, scope, assumptions</text>

  <rect class="box basis" x="490" y="214" width="170" height="70" rx="12"/>
  <text class="head" x="506" y="242"><tspan class="letter">F</tspan>  Criterion</text>
  <text class="note" x="506" y="266">would falsify H</text>

  <rect class="box basis" x="672" y="214" width="166" height="70" rx="12"/>
  <text class="head" x="688" y="242"><tspan class="letter">P</tspan>  Prediction</text>
  <text class="note" x="688" y="266">expected if H holds</text>

  <path class="edge" d="M575,214 L600,174"/>
  <path class="edge" d="M755,214 L720,174"/>
  <text class="elabel" x="660" y="200" text-anchor="middle">owned by H</text>

  <!-- Another hypothesis, through a link -->
  <rect class="box outside" x="40" y="100" width="220" height="74" rx="12"/>
  <text class="head" x="56" y="130"><tspan class="letter">H</tspan>  Other hypothesis</text>
  <text class="note" x="56" y="155">a rival or a dependency</text>
  <path class="edge" d="M540,148 L262,148" marker-end="url(#a)"/>
  <text class="elabel" x="274" y="114">Link <tspan class="rel">depends-on</tspan>,</text>
  <text class="rel" x="274" y="134">competes-with, supersedes</text>

  <!-- Experiment and run -->
  <rect class="box outside" x="1010" y="100" width="230" height="74" rx="12"/>
  <text class="head" x="1026" y="130"><tspan class="letter">X</tspan>  Experiment</text>
  <text class="note" x="1026" y="155">procedure, status</text>
  <path class="edge" d="M1010,137 L782,137" marker-end="url(#a)"/>
  <text class="elabel" x="930" y="118" text-anchor="middle">may target H, F, P</text>
  <text class="elabel" x="930" y="160" text-anchor="middle">as frozen copies</text>

  <rect class="box basis" x="1010" y="214" width="230" height="70" rx="12"/>
  <text class="head" x="1026" y="242"><tspan class="letter">R</tspan>  Run</text>
  <text class="note" x="1026" y="266">outcome, frozen plan</text>
  <path class="edge" d="M1125,214 L1125,176" marker-end="url(#a)"/>
  <text class="elabel" x="1115" y="200" text-anchor="end">run of</text>

  <!-- Evidence, linked to the claim -->
  <rect class="box basis" x="530" y="372" width="260" height="88" rx="12"/>
  <text class="head" x="546" y="400"><tspan class="letter">E</tspan>  Evidence</text>
  <text class="note" x="546" y="423">an observation, with its</text>
  <text class="note" x="546" y="443">source and locator</text>
  <path class="edge" d="M660,372 L660,302" marker-end="url(#a)"/>
  <text class="elabel" x="672" y="326">Link <tspan class="rel">supports</tspan>, <tspan class="rel">contradicts</tspan> or <tspan class="rel">qualifies</tspan></text>
  <text class="elabel" x="672" y="346">to H, F or P, with a reason</text>

  <!-- Run cites evidence -->
  <path class="edge" d="M1125,284 L1125,410 L792,410" marker-end="url(#a)"/>
  <text class="elabel" x="960" y="402" text-anchor="middle">cites evidence</text>

  <!-- Data -->
  <rect class="box outside" x="1010" y="440" width="230" height="100" rx="12"/>
  <text class="head" x="1026" y="468"><tspan class="letter">D</tspan>  Data</text>
  <text class="note" x="1026" y="491">captured bytes, sha256;</text>
  <text class="note" x="1026" y="511">never changes. Any record</text>
  <text class="note" x="1026" y="531">but D may reference it</text>
  <path class="edge" d="M790,450 L1008,450" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text class="rel" x="900" y="470" text-anchor="middle">data: [D-…]</text>

  <!-- Assessment -->
  <rect class="box outside" x="40" y="372" width="240" height="88" rx="12"/>
  <text class="head" x="56" y="400"><tspan class="letter">A</tspan>  Assessment</text>
  <text class="note" x="56" y="423">judgment, reason, confidence;</text>
  <text class="note" x="56" y="443">fingerprint of the basis</text>
  <path class="edge" d="M160,372 L160,246 L468,246" marker-end="url(#a)"/>
  <text class="elabel" x="176" y="238">judges H; names F if falsified</text>
  <path class="edge" d="M280,416 L528,416" marker-end="url(#a)"/>
  <text class="elabel" x="404" y="406" text-anchor="middle">cites linked evidence</text>

  <path d="M160,460 L160,500" stroke="#d29922" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="60" y="500" width="200" height="34" rx="17" fill="#3a2a0a" stroke="#d29922" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="160" y="522" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#f2cc60">needs review</text>
  <text class="note" x="40" y="556">when the basis changes, or a merge</text>
  <text class="note" x="40" y="576">leaves two current assessments</text>

  <!-- Gap -->
  <rect class="box outside" x="530" y="560" width="260" height="70" rx="12"/>
  <text class="head" x="546" y="588"><tspan class="letter">G</tspan>  Gap</text>
  <text class="note" x="546" y="612">an open question about H</text>
  <path class="edge" d="M660,560 L660,462" marker-end="url(#a)"/>
  <text class="rel" x="672" y="516">resolved_by</text>

  <!-- Legend -->
  <rect x="40" y="652" width="26" height="16" rx="4" fill="#16243a" stroke="#39c5bb" stroke-width="2"/>
  <text class="legend" x="76" y="665">In the basis: H, its F and P, links that touch them, evidence linked to them, runs of H's experiments and the evidence they cite.</text>
  <rect x="40" y="680" width="26" height="16" rx="4" fill="#16243a" stroke="#5c6f88" stroke-width="2"/>
  <text class="legend" x="76" y="693">Outside it: lifecycle, tags, the untestable reason, timestamps, experiments, gaps, assessments, other hypotheses (only their link counts).</text>
  <text class="legend" x="76" y="721">Data counts by its sha256 where a basis record references it.</text>
</svg>
