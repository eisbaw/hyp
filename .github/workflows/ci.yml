# Thin wrapper: the checks live in the flake (`nix flake check`), so CI and a
# developer run the same thing, on Linux and on macOS (Apple Silicon and
# Intel), except the browser test on macOS (see e2e-browser in flake.nix).
# aarch64-linux is not built here. macos-15-intel is GitHub's last Intel
# image, and nixpkgs 26.05 the last release for x86_64-darwin.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# No id-token: nothing here logs in to FlakeHub.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake-check:
    strategy:
      # A macOS-only failure should not hide whether Linux passed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          diagnostic-endpoint: ""
      # Optional speed-up only: if this cache breaks, CI gets slower, not red.
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: disabled
          diagnostic-endpoint: ""
      - run: nix flake check -L
      # macOS has no e2e-browser check (see flake.nix): the same test of the
      # packaged hyp runs as the runner user. Reported even if the checks fail.
      - if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: nix run .#browser-test
      # nix flake check only evaluates the dev shell; this builds hyp in it.
      - if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: nix develop -c just build
